name: Isolated Linux web preview

on:
  workflow_dispatch:
  push:
    branches: ['codex/isolated-preview-build-20261020']
    paths: ['preview-build/**', '.github/workflows/isolated-preview.yml']

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out build inputs
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify and unpack source-only inputs
        run: |
          python3 - <<'PY'
          import hashlib, json, zipfile
          from pathlib import Path, PurePosixPath
          root = Path.cwd()
          manifest = json.loads((root / 'preview-build/manifest.json').read_text())
          for record in manifest['archives']:
              archive = root / 'preview-build' / record['name']
              assert hashlib.sha256(archive.read_bytes()).hexdigest() == record['sha256'], archive
              with zipfile.ZipFile(archive) as z:
                  for entry in z.infolist():
                      path = PurePosixPath(entry.filename)
                      assert not path.is_absolute() and '..' not in path.parts
                      assert path.parts[0] in {'lib', 'test', 'web', 'assets', 'tools', 'pubspec.yaml', 'pubspec.lock', 'analysis_options.yaml'}
                      assert path.suffix.lower() not in {'.exe', '.dll', '.bat', '.cmd', '.msi'}
                  z.extractall(root)
          print('Verified source and public school assets; no Windows executables supplied.')
          PY
      - name: Install checksum-verified official Linux Flutter SDK
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 'https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_3.47.2-stable.tar.xz' -o "$RUNNER_TEMP/flutter.tar.xz"
          echo '447878859d01ca9bfdb99a85f245af07ed8a15fedcd9d189c4749e8e92d1f185  '"$RUNNER_TEMP/flutter.tar.xz" | sha256sum --check
          tar -xJf "$RUNNER_TEMP/flutter.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          find "$RUNNER_TEMP/flutter/bin/cache/dart-sdk" -type f -print0 | sort -z | xargs -0 sha256sum > "$RUNNER_TEMP/dart-sdk.sha256"
      - name: Resolve locked packages
        run: flutter pub get --enforce-lockfile
      - name: Analyse updated app
        run: flutter analyze
      - name: Run widget and app regressions
        run: flutter test --concurrency=1 --reporter expanded
      - name: Check all page layouts on phone and desktop in both themes
        env:
          ATLAS_LAYOUT_PAGE: shell,choices,tools,home,explore,saved,compare,guides,checklist,resources,pilot,placement,results,results-location,results-choices,account,careers,support,offline,stories,sources,portal,privacy,profile,profile-bawjiase
        run: |
          for width in 390 1280; do
            for dark in false true; do
              ATLAS_LAYOUT_WIDTH="$width" ATLAS_LAYOUT_DARK="$dark" ATLAS_LAYOUT_SCALE=1 flutter test test/page_layout_audit_test.dart --concurrency=1 --reporter expanded
            done
          done
          ATLAS_LAYOUT_WIDTH=320 ATLAS_LAYOUT_DARK=true ATLAS_LAYOUT_SCALE=1.4 flutter test test/page_layout_audit_test.dart --concurrency=1 --reporter expanded
      - name: Build local-preview web files
        run: |
          flutter build web --no-pub --no-web-resources-cdn --no-wasm-dry-run --no-tree-shake-icons --target lib/main.dart
          python3 tools/build_offline_manifest.py
          sha256sum --check --quiet "$RUNNER_TEMP/dart-sdk.sha256"
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          files = {str(p.relative_to('build/web')): hashlib.sha256(p.read_bytes()).hexdigest() for p in Path('build/web').rglob('*') if p.is_file()}
          Path('build/web/build-provenance.json').write_text(json.dumps({'workflowCommit': os.environ['GITHUB_SHA'], 'runId': os.environ['GITHUB_RUN_ID'], 'flutter': '3.47.2', 'platform': 'Linux', 'files': files}, indent=2))
          PY
      - name: Save preview files (no deployment)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: skool-atlas-isolated-web-preview
          path: build/web/
          retention-days: 7
          if-no-files-found: error
